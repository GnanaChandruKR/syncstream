<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncStream</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 1rem; max-width: 600px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; text-align: center; color: #38bdf8; }
        .card { background: #1e293b; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
        .player-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        #albumArt { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background: #334155; }
        .track-details { overflow: hidden; }
        #trackTitle { font-size: 1.1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #trackArtist { font-size: 0.9rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .controls { display: flex; justify-content: center; gap: 1rem; align-items: center; margin-bottom: 0.5rem; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
        button:active { transform: scale(0.98); }
        .search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        input[type="text"] { flex: 1; padding: 0.6rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
        .results, .queue { list-style: none; overflow-y: auto; max-height: 250px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem; border-bottom: 1px solid #334155; gap: 0.5rem; }
        .item-info { flex: 1; overflow: hidden; }
        .item-title { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-artist { font-size: 0.8rem; color: #94a3b8; }
        .btn-add { background: #22c55e; color: #fff; padding: 0.3rem 0.6rem; font-size: 0.8rem; }
        #progress { width: 100%; margin: 0.5rem 0; accent-color: #38bdf8; }
        #logs { font-family: monospace; font-size: 0.75rem; color: #94a3b8; height: 60px; overflow-y: auto; background: #020617; padding: 0.5rem; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>SyncStream Player</h1>

    <div class="card">
        <div class="player-header">
            <img id="albumArt" src="https://via.placeholder.com/70x70.png?text=Sync" alt="Artwork">
            <div class="track-details">
                <div id="trackTitle">No track playing</div>
                <div id="trackArtist">Queue a track below</div>
            </div>
        </div>

        <input type="range" id="progress" value="0" min="0" max="100" step="1">

        <div class="controls">
            <button id="btnPlayPause">Play</button>
            <button id="btnNext">Next ⏭</button>
        </div>

        <!-- Strict HTML5 Audio element without any video wrappers -->
        <audio id="audioPlayer" preload="auto" playsinline></audio>
    </div>

    <div class="card">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search song or artist...">
            <button id="btnSearch">Search</button>
        </div>
        <ul id="searchResults" class="results"></ul>
    </div>

    <div class="card">
        <h3>Queue</h3>
        <ul id="queueList" class="queue"></ul>
    </div>

    <div id="logs">Waiting for connection...</div>

    <script>
        const socket = io();
        const audio = document.getElementById('audioPlayer');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnNext = document.getElementById('btnNext');
        const progress = document.getElementById('progress');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const albumArt = document.getElementById('albumArt');
        const searchInput = document.getElementById('searchInput');
        const btnSearch = document.getElementById('btnSearch');
        const searchResults = document.getElementById('searchResults');
        const queueList = document.getElementById('queueList');
        const logBox = document.getElementById('logs');

        let isSeeking = false;
        let currentTrackData = null;

        function log(msg) {
            const row = document.createElement('div');
            row.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.appendChild(row);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Setup native MediaSession for background audio & lock screen control
        function updateMediaSession(track) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    artwork: [
                        { src: track.thumbnail || 'https://via.placeholder.com/512x512.png?text=Audio', sizes: '512x512', type: 'image/jpeg' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => {
                    audio.play().then(() => {
                        socket.emit('sync_event', { action: 'play', time: audio.currentTime });
                        btnPlayPause.textContent = 'Pause';
                    }).catch(e => log(`Play error: ${e.message}`));
                });

                navigator.mediaSession.setActionHandler('pause', () => {
                    audio.pause();
                    socket.emit('sync_event', { action: 'pause', time: audio.currentTime });
                    btnPlayPause.textContent = 'Play';
                });

                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    socket.emit('next_track');
                });

                navigator.mediaSession.setActionHandler('seekto', (details) => {
                    if (details.seekTime && audio.duration) {
                        audio.currentTime = details.seekTime;
                        socket.emit('sync_event', { action: 'seek', time: details.seekTime });
                    }
                });
            }
        }

        // Socket IO Handlers
        socket.on('connect', () => log('Connected to server.'));
        socket.on('log_message', (data) => log(data.text));

        socket.on('init_state', (state) => {
            renderQueue(state.queue);
            if (state.current_track && state.stream_url) {
                applyTrack(state.current_track, state.stream_url, state.current_time, state.is_playing);
            }
        });

        socket.on('track_change', (data) => {
            renderQueue(data.queue);
            applyTrack(data.track, data.stream_url, 0, true);
        });

        socket.on('sync_action', (data) => {
            if (data.action === 'play') {
                if (Math.abs(audio.currentTime - data.time) > 1.5) audio.currentTime = data.time;
                audio.play().catch(e => log(`Autoplay blocked: ${e.message}`));
                btnPlayPause.textContent = 'Pause';
            } else if (data.action === 'pause') {
                audio.pause();
                btnPlayPause.textContent = 'Play';
            } else if (data.action === 'seek') {
                audio.currentTime = data.time;
            }
        });

        socket.on('drift_sync', (data) => {
            if (Math.abs(audio.currentTime - data.time) > 2.0) {
                audio.currentTime = data.time;
            }
        });

        socket.on('queue_updated', (data) => renderQueue(data.queue));
        socket.on('queue_ended', () => {
            trackTitle.textContent = "Queue ended";
            trackArtist.textContent = "";
            btnPlayPause.textContent = "Play";
            audio.pause();
            audio.src = "";
        });

        function applyTrack(track, url, startTime = 0, autoPlay = true) {
            currentTrackData = track;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            if (track.thumbnail) albumArt.src = track.thumbnail;

            audio.src = url;
            audio.currentTime = startTime;

            updateMediaSession(track);

            if (autoPlay) {
                audio.play().then(() => {
                    btnPlayPause.textContent = 'Pause';
                }).catch(err => {
                    log('Tap Play to unlock audio.');
                    btnPlayPause.textContent = 'Play';
                });
            }
        }

        function renderQueue(queue) {
            queueList.innerHTML = '';
            queue.forEach((t) => {
                const li = document.createElement('li');
                li.className = 'item';
                li.innerHTML = `
                    <div class="item-info">
                        <div class="item-title">${t.title}</div>
                        <div class="item-artist">${t.artist}</div>
                    </div>
                `;
                queueList.appendChild(li);
            });
        }

        // Controls
        btnPlayPause.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    socket.emit('sync_event', { action: 'play', time: audio.currentTime });
                    btnPlayPause.textContent = 'Pause';
                }).catch(e => log(`Play error: ${e.message}`));
            } else {
                audio.pause();
                socket.emit('sync_event', { action: 'pause', time: audio.currentTime });
                btnPlayPause.textContent = 'Play';
            }
        });

        btnNext.addEventListener('click', () => socket.emit('next_track'));

        audio.addEventListener('timeupdate', () => {
            if (!isSeeking && audio.duration) {
                progress.value = (audio.currentTime / audio.duration) * 100;
            }
        });

        progress.addEventListener('input', () => { isSeeking = true; });
        progress.addEventListener('change', () => {
            if (audio.duration) {
                const newTime = (progress.value / 100) * audio.duration;
                audio.currentTime = newTime;
                socket.emit('sync_event', { action: 'seek', time: newTime });
            }
            isSeeking = false;
        });

        audio.addEventListener('ended', () => socket.emit('next_track'));

        // Search
        btnSearch.addEventListener('click', async () => {
            const q = searchInput.value.trim();
            if (!q) return;
            searchResults.innerHTML = '<li class="item">Searching...</li>';
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
                const tracks = await res.json();
                searchResults.innerHTML = '';
                tracks.forEach(track => {
                    const li = document.createElement('li');
                    li.className = 'item';
                    li.innerHTML = `
                        <div class="item-info">
                            <div class="item-title">${track.title}</div>
                            <div class="item-artist">${track.artist}</div>
                        </div>
                        <button class="btn-add">Add</button>
                    `;
                    li.querySelector('.btn-add').addEventListener('click', () => {
                        socket.emit('sync_event', { action: 'add_to_queue', track });
                    });
                    searchResults.appendChild(li);
                });
            } catch (err) {
                searchResults.innerHTML = `<li class="item">Search error: ${err.message}</li>`;
            }
        });
    </script>
</body>
</html>
